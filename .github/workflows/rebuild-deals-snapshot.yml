name: Rebuild deals.json snapshot

# Refreshes the static data/deals.json snapshot from Supabase so the site
# loads fast. Deliberately does NOT scrape Silicon Canals — new deals now
# come in exclusively via the big monthly scrape (where Silicon Canals is a
# Tier 1 source). This job only reads the DB and rebuilds the snapshot;
# no Anthropic tokens, no third-party scraping.
#
# Runs on the 2nd of the month — a day after the big scrape (a Cowork routine
# that runs on the 1st) — so the snapshot always reflects that month's new
# deals. After any manual scrape you can also trigger it immediately from the
# Actions tab ("Run workflow") to refresh the site.

on:
  schedule:
    - cron: '0 6 2 * *'   # Monthly on the 2nd at 06:00 UTC (day after the big scrape)
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write  # Needed to commit the regenerated data/deals.json

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild static deals.json snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrapers/export_deals_json.py

      - name: Commit refreshed deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: refresh data/deals.json snapshot"
            git push
          fi
